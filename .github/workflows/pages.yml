name: Deploy demo page
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'media/a3/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble demo page
        run: |
          mkdir -p _site/media
          cp site/index.html _site/index.html
          cp media/a3/035_200k_a3_fast_rknn_teleop.jpg _site/media/
          cp media/a3/035_200k_a3_fast_rknn_teleop.mp4 _site/media/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
