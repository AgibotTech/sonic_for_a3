# @package _global_

# Reward-only calibration overlay for the complete A3 motor constraint bundle.
# It does not change policy actions or simulator actuator dynamics.
#
# The T-N outer weight is -1.0:
#   -0.05 * sum(min(r, 1)^8) - 5.0 * sum(relu(r - 1)^2)
# Additional ankle constraints operate on the two physical PFP78 motors after
# HAL Jacobian mapping.  The pitch/roll cross terms intentionally remain a
# low-weight serial-coordinate shaping heuristic.
defaults:
  - base_eval
  - _self_

reward_curve_enabled: true
reward_curve_output_dir: ${eval_output_dir}/reward_curves

manager_env:
  rewards:
    motor_tn_serial_soft_diag:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:A3MotorTNPenalty
      weight: -0.05
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
        group: serial
        component: soft
        lambda_soft: 0.05
        lambda_violation: 5.0
        soft_exponent: 8.0
        violation_exponent: 2.0
        utilization_cap: 2.0

    motor_tn_serial_hard_diag:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:A3MotorTNPenalty
      weight: -5.0
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
        group: serial
        component: hard
        lambda_soft: 0.05
        lambda_violation: 5.0
        soft_exponent: 8.0
        violation_exponent: 2.0
        utilization_cap: 2.0

    motor_tn_parallel_soft_diag:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:A3MotorTNPenalty
      weight: -0.05
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
        group: parallel
        component: soft
        lambda_soft: 0.05
        lambda_violation: 5.0
        soft_exponent: 8.0
        violation_exponent: 2.0
        utilization_cap: 2.0

    motor_tn_parallel_hard_diag:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:A3MotorTNPenalty
      weight: -5.0
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
        group: parallel
        component: hard
        lambda_soft: 0.05
        lambda_violation: 5.0
        soft_exponent: 8.0
        violation_exponent: 2.0
        utilization_cap: 2.0

    ankle_motor_speed_diag:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:A3AnkleMotorConstraintPenalty
      weight: -2.0
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
        constraint: speed
        threshold_ratio: 0.8
        lambda_soft: 1.0
        lambda_violation: 5.0
        soft_exponent: 2.0
        violation_exponent: 2.0
        utilization_cap: 2.0
        motor_speed_limit_rad_s: 23.561945

    ankle_motor_power_diag:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:A3AnkleMotorConstraintPenalty
      weight: -2.0
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
        constraint: power
        threshold_ratio: 0.8
        lambda_soft: 1.0
        lambda_violation: 5.0
        soft_exponent: 2.0
        violation_exponent: 2.0
        utilization_cap: 2.0
        motor_power_limit_w: 971.799338

    ankle_motor_fixed_torque_diag:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:A3AnkleMotorConstraintPenalty
      weight: -1.0
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
        constraint: fixed_torque
        threshold_ratio: 1.0
        lambda_soft: 0.0
        lambda_violation: 5.0
        soft_exponent: 2.0
        violation_exponent: 1.0
        utilization_cap: 2.0
        motor_torque_limit_nm: 58.0

    parallel_ankle_cross_diag:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:A3ParallelJointCrossPenalty
      weight: -0.1
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
        group: ankle
        threshold_ratio: 0.75
        joint_effort_limits:
          left_ankle_pitch_joint: 118.2
          left_ankle_roll_joint: 54.75
          right_ankle_pitch_joint: 118.2
          right_ankle_roll_joint: 54.75

    parallel_waist_cross_diag:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:A3ParallelJointCrossPenalty
      weight: -0.05
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
        group: waist
        threshold_ratio: 0.75
        joint_effort_limits:
          waist_pitch_joint: 115.0
          waist_roll_joint: 46.0

    ankle_position_85_diag:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:A3AnklePositionPenalty
      weight: -10.0
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
        threshold_ratio: 0.85
        exponent: 2.0
