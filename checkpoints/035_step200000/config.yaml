env_spacing: 20
output_dir: ${experiment_dir}/output
eval_overrides:
  headless: false
  num_envs: 1
  auto_load_latest: false
  use_wandb: false
algo:
  trl:
    dataset_name: dummy
    output_dir: ${experiment_dir}
    learning_rate: ${algo.config.actor_learning_rate}
    num_total_batches: ${algo.config.num_learning_iterations}
    total_episodes: null
    num_ppo_epochs: ${algo.config.num_learning_epochs}
    num_mini_batches: ${algo.config.num_mini_batches}
    per_device_train_batch_size: null
    gradient_accumulation_steps: 1
    report_to: tensorboard
    gamma: ${algo.config.gamma}
    lam: ${algo.config.lam}
    vf_coef: ${algo.config.value_loss_coef}
    max_grad_norm: ${algo.config.max_grad_norm}
    lr_scheduler_type: constant
    save_strategy: 'no'
    disable_tqdm: true
    logging_dir: ${experiment_dir}/tensorboard
  config:
    critic:
      _target_: gear_sonic.trl.modules.actor_critic_modules.Critic
      running_mean_std: true
      backbone:
        _target_: gear_sonic.trl.modules.base_module.BaseModule
        process_output_dim: true
        module_config_dict:
          type: MLP
          input_dim:
          - critic_obs
          output_dim:
          - 1
          layer_config:
            type: MLP
            hidden_dims:
            - 2048
            - 2048
            - 1024
            - 1024
            - 512
            - 512
            activation: SiLU
    actor:
      backbone:
        quantizer:
          _target_: vector_quantize_pytorch.FSQ
        encoders:
          g1:
            inputs:
            - command_multi_future_nonflat
            - motion_anchor_ori_b_mf_nonflat
            params:
              _target_: gear_sonic.trl.modules.base_module.BaseModule
              input_dim: null
              output_dim: null
              num_input_temporal_dims: ${manager_env.commands.motion.num_future_frames}
              num_output_temporal_dims: ${algo.config.actor.backbone.max_num_tokens}
              module_config_dict:
                layer_config:
                  type: MLP
                  hidden_dims:
                  - 2048
                  - 1024
                  - 512
                  - 512
                  activation: SiLU
            freeze: false
          teleop:
            inputs:
            - command_multi_future_lower_body
            - vr_3point_local_target
            - vr_3point_local_orn_target
            - motion_anchor_ori_b
            params:
              _target_: gear_sonic.trl.modules.base_module.BaseModule
              input_dim: null
              output_dim: null
              num_input_temporal_dims: null
              num_output_temporal_dims: ${algo.config.actor.backbone.max_num_tokens}
              module_config_dict:
                layer_config:
                  type: MLP
                  hidden_dims:
                  - 2048
                  - 1024
                  - 512
                  - 512
                  activation: SiLU
          smpl:
            inputs:
            - smpl_joints_multi_future_local_nonflat
            - smpl_root_ori_b_multi_future
            - joint_pos_multi_future_wrist_for_smpl
            params:
              _target_: gear_sonic.trl.modules.base_module.BaseModule
              input_dim: null
              output_dim: null
              num_input_temporal_dims: ${manager_env.commands.motion.smpl_num_future_frames}
              num_output_temporal_dims: ${algo.config.actor.backbone.max_num_tokens}
              module_config_dict:
                layer_config:
                  type: MLP
                  hidden_dims:
                  - 2048
                  - 1024
                  - 512
                  - 512
                  activation: SiLU
          a3_fast:
            inputs:
            - command_multi_future_a3_fast_nonflat
            - motion_anchor_ori_a3_fast_b_mf_nonflat
            init_from_encoder:
              source: g1
              policy: missing_only
            params:
              _target_: gear_sonic.trl.modules.base_module.BaseModule
              input_dim: null
              output_dim: null
              num_input_temporal_dims: ${manager_env.commands.motion.a3_fast_num_future_frames}
              num_output_temporal_dims: ${algo.config.actor.backbone.max_num_tokens}
              module_config_dict:
                layer_config:
                  type: MLP
                  hidden_dims:
                  - 2048
                  - 1024
                  - 512
                  - 512
                  activation: SiLU
        decoders:
          g1_dyn:
            inputs:
            - token_flattened
            - proprioception
            outputs:
            - action
            has_temporal_dim: false
            params:
              _target_: gear_sonic.trl.modules.base_module.BaseModule
              input_dim: null
              output_dim: null
              num_input_temporal_dims: null
              num_output_temporal_dims: null
              module_config_dict:
                layer_config:
                  type: MLP
                  hidden_dims:
                  - 2048
                  - 2048
                  - 1024
                  - 1024
                  - 512
                  - 512
                  activation: SiLU
            freeze: false
          g1_kin:
            inputs:
            - token
            outputs:
            - command_multi_future_nonflat
            - motion_anchor_ori_b_mf_nonflat
            has_temporal_dim: true
            params:
              _target_: gear_sonic.trl.modules.base_module.BaseModule
              input_dim: null
              output_dim: null
              num_input_temporal_dims: ${algo.config.actor.backbone.max_num_tokens}
              num_output_temporal_dims: ${manager_env.commands.motion.num_future_frames}
              module_config_dict:
                layer_config:
                  type: MLP
                  hidden_dims:
                  - 2048
                  - 1024
                  - 512
                  - 512
                  activation: SiLU
            freeze: false
        _target_: gear_sonic.trl.modules.universal_token_modules.UniversalTokenModule
        num_future_frames: ${manager_env.commands.motion.num_future_frames}
        proprioception_features:
        - actor_obs
        encoder_sample_probs: ${manager_env.commands.motion.encoder_sample_probs}
        num_fsq_levels: 32
        fsq_level_list: 32
        max_num_tokens: 2
        aux_loss_func:
          g1_recon:
            _target_: gear_sonic.trl.losses.token_losses.G1ReconLoss
            loss_type: mse
          a3_fast_g1_latent:
            _target_: gear_sonic.trl.losses.token_losses.A3FastG1LatentLoss
            loss_type: mse
          reencoded_a3_fast_g1_latent:
            _target_: gear_sonic.trl.losses.token_losses.ReencodedA3FastG1LatentLoss
            loss_type: mse
        aux_loss_coef:
          g1_recon: 0.01
          a3_fast_g1_latent: 1.0
          reencoded_a3_fast_g1_latent: 0.0
        reencode_smpl_g1_recon: false
        active_encoders:
        - g1
        - a3_fast
        active_decoders:
        - g1_dyn
        - g1_kin
        reencode_a3_fast_g1_recon: false
      _target_: gear_sonic.trl.modules.actor_critic_modules.Actor
      running_mean_std: false
      input_obs_dict: true
      has_aux_loss: true
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    value_loss_coef: 1.0
    entropy_coef: 0.01
    actor_learning_rate: 2.0e-05
    critic_learning_rate: 0.001
    max_grad_norm: 0.1
    use_clipped_value_loss: true
    schedule: adaptive
    desired_kl: 0.01
    adaptive_lr_min: 1.0e-05
    adaptive_lr_max: 0.0002
    use_new_actor_critic: true
    use_padding_mask: false
    ppo_shuffle_every_epoch: true
    sync_advantage_normalization: true
    empty_cache_every_n_ppo_epoch: -1
    num_steps_per_env: 24
    save_interval: 500
    eval_frequency: 500
    load_optimizer: true
    init_noise_std: 0.05
    num_learning_iterations: 100000
    init_at_random_ep_len: true
    global_rank: 0
    world_size: 32
    use_clampped_std: true
    std_clamp_min: 0.001
    std_clamp_max: 0.5
    compute_aux_loss: true
    adaptive_empty_cache_enabled: true
    adaptive_empty_cache_reserved_frac: 0.9
    adaptive_empty_cache_free_frac: 0.1
    adaptive_empty_cache_min_reclaimable_mb: 1024
    adaptive_empty_cache_cooldown_ppo_epochs: 5
  _recursive_: false
env: ???
terrain: ???
callbacks:
  model_save:
    _target_: gear_sonic.trl.callbacks.model_save_callback.ModelSaveCallback
    save_dir: ${experiment_dir}
