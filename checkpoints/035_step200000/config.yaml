num_gpus: 1
max_retries: 1
seed: 0
codebase_version: 1.0
headless: true
num_envs: 4096
auto_load_latest: false
checkpoint: null
project_name: TRL_A3_035
experiment_name: ${exp_base}_${exp_var}
base_dir: logs_rl
timestamp: ${now:%Y%m%d_%H%M%S}
experiment_dir: ${base_dir}/${project_name}/${experiment_name}
save_dir: ${experiment_dir}
force_flat_terrain: false
use_wandb: false
log_task_name: TEST
multi_gpu: true
global_rank: 0
