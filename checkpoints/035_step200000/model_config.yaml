  - 1.8
  experiment_dir: checkpoints/035_step200000
  headless: true
  meta_action_dim: null
  needs_policy_atm: true
  num_envs: 1
  object_mass: null
  obs:
    group_obs_dims:
      tokenizer:
        command_multi_future_a3_fast_nonflat:
        - 10
        - 58
        command_multi_future_lower_body:
        - 240
        command_multi_future_nonflat:
        - 10
        - 58
        command_z:
        - 1
        command_z_multi_future_nonflat:
        - 10
        - 1
        encoder_index:
        - 4
        joint_pos_multi_future_wrist_for_smpl:
        - 10
        - 6
        motion_anchor_ori_a3_fast_b_mf_nonflat:
        - 10
        - 6
        motion_anchor_ori_b:
        - 6
        motion_anchor_ori_b_mf_nonflat:
        - 10
        - 6
        smpl_joints_multi_future_local_nonflat:
        - 10
        - 72
        smpl_root_ori_b_multi_future:
        - 10
        - 6
        vr_3point_local_orn_target:
        - 12
        vr_3point_local_target:
        - 9
    group_obs_names:
      tokenizer:
      - encoder_index
      - command_multi_future_nonflat
      - command_multi_future_a3_fast_nonflat
      - command_z_multi_future_nonflat
      - command_z
      - motion_anchor_ori_b
      - motion_anchor_ori_b_mf_nonflat
      - motion_anchor_ori_a3_fast_b_mf_nonflat
      - command_multi_future_lower_body
      - vr_3point_local_target
      - vr_3point_local_orn_target
      - smpl_joints_multi_future_local_nonflat
      - smpl_root_ori_b_multi_future
      - joint_pos_multi_future_wrist_for_smpl
    obs_dict: {}
    obs_dims:
