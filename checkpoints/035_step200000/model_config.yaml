      tokenizer: 2402
  render_results: false
  rewards:
    num_critics: 1
  robot:
    actions_dim: 29
    algo_obs_dim_dict:
      actor_obs: 930
      critic_obs: 1645
      tokenizer: 2402
    asset_path: gear_sonic/data/assets/robot_description/urdf/a3/model_collision_optimized_passive_foot_twostage_fit_optimized.urdf
    type: a3_exp023
    use_fitted_passive_foot_gains: true
  save_rendering_dir: checkpoints/035_step200000/renderings_training
  sim_dt: 0.005
  table_offset: null
